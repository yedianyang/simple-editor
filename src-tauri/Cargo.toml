[package]
name = "fieldcorder"
version = "1.0.0"
description = "Lightweight DAW for multi-channel environmental recording editing"
authors = []
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
urlencoding = "2"
ndarray = "0.15"
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet.git", tag = "v0.5.6", features = ["tract", "default-model", "transforms"], default-features = false }
ort = { version = "2.0.0-rc.12", optional = true }
flate2 = { version = "1.0", optional = true }
tar = { version = "0.4", optional = true }
ini = { version = "1.3", optional = true }

[features]
default = ["gpu-denoise"]
gpu-denoise = ["dep:ort", "dep:flate2", "dep:tar", "dep:ini"]
